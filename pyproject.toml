[project]
name = "ignite"
version = "0.1.0"
description = "Workspace toolchain bootstrapper (Python engine)."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
ignite = "ignite.cli:main"

[build-system]
requires = ["uv_build>=0.4.5"]
build-backend = "uv_build"

[tool.uv]
package = true

# Example consumer pins. Copy to the workspace root as mise.toml.
# Ignite plants mise, then `mise install` reads this file.
# Graphify (every product): PyPI package graphifyy; CLI is graphify.

[settings.pipx]
uvx = true

[tools]
go = "1.25.0"
node = "22.12.0"
python = "3.12.10"
mani = "0.32.1"
uv = "0.12.10"
"pipx:graphifyy" = "0.9.55"

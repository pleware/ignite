# Example consumer pins. Copy to the workspace root as mise.toml.
# Ignite plants mise, then `mise install` reads this file.
# A PyPI console script needed by one workspace goes here as
# "pipx:<package>". One needed by the whole fleet belongs to the kit
# instead — pins/tools.sh (graphify is pinned there).

[settings.pipx]
uvx = true

[tools]
go = "1.25.0"
node = "22.12.0"
python = "3.12.10"
mani = "0.32.1"
uv = "0.12.10"

# Portable ignite policy. Commit this file. No host paths.
# Machine cache and working copy live in .ignite/ (gitignored).
# Language pins: mise.toml.
# Postgres/Redis: Compose in the consumer tree. LiteLLM: hosted externally.
#
# Layout is a document, not a kit profile. Kinds live in the YAML.
# [kit] pin is the git ref agentize clones when this machine has no kit yet.

[kit]
pin = "main"
# url = "https://github.com/pleware/ignite.git"

[workspace-tree]
file = "workspace-layout.yaml"
kind = "notes"

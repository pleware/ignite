name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Kit tests + coverage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Tests under kcov
        run: sh tests/coverage.sh

      - name: Flatten cobertura for Codecov
        run: |
          f=$(find coverage -name cobertura.xml | head -n 1)
          test -n "$f"
          cp "$f" coverage/cobertura.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
          use_oidc: true

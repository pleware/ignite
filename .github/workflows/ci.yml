name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Kit tests + coverage
    # kcov is not in Ubuntu 24.04 apt. 22.04 still ships it (until 2027).
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Tests under kcov
        run: sh tests/coverage.sh

      - name: Check cobertura
        run: |
          test -f coverage/cobertura.xml
          grep -q 'lines-valid="[1-9]' coverage/cobertura.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: true
          use_oidc: true
